<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rising Waters - Modern Machine Learning Flood Prediction System">
  <title>{% block title %}Rising Waters - Flood Prediction{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <!-- Rain Animation Layer -->
  <canvas id="rainCanvas"></canvas>
  <div class="bg-gradient-overlay"></div>

  <div class="layout-container">
    <header>
      <a href="/" class="brand">
        <div class="brand-icon">⚡</div>
        <span class="brand-text">Rising Waters</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/predict-page">Predict Flood</a></li>
        </ul>
      </nav>
    </header>

    <main>
      {% block content %}
      {% endblock %}
    </main>

    <footer>
      <p>&copy; 2026 Rising Waters. Powered by Scikit-Learn & Flask.</p>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='js/rain.js') }}"></script>
  {% block scripts %}
  {% endblock %}
</body>
</html>
